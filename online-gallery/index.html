<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rato Photo Gallery</title>
    <meta name="description" content="Photo strips guests shared from the Rato photo booth." />
    <link rel="icon" href="rato-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      /* The booth's tokens (client/src/index.css), so the online gallery looks like the booth. */
      :root {
        --leaf: #9bc45a;
        --navy: #14284f;
        --navy-hover: #1d3768;
        --ground: #f3f6f8;
        --muted: #5b6577;
        --text: #101a33;
        --surface: #fff;
        --border: #e2e7ee;
        --radius-card: 20px;
        --radius-control: 12px;
        --shadow-float: 0 12px 32px rgb(20 40 79 / 14%);
        --sans: 'Plus Jakarta Sans', system-ui, 'Segoe UI', Roboto, sans-serif;

        font: 400 15px/1.5 var(--sans);
        color: var(--text);
        background: var(--ground);
        color-scheme: light;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--ground);
      }

      h1,
      p {
        margin: 0;
      }

      .page {
        max-width: 1120px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .header img {
        width: 44px;
        height: 44px;
      }

      .title {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.2;
        color: var(--navy);
      }

      .caption {
        font-size: 12px;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 16px;
      }

      .strip {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }

      .strip:hover,
      .strip:focus-visible {
        box-shadow: var(--shadow-float);
        outline: none;
      }

      .strip img {
        width: 100%;
        aspect-ratio: 1 / 3;
        object-fit: cover;
        border-radius: 12px;
        background: var(--ground);
      }

      .message {
        padding: 48px 16px;
        border: 1px dashed var(--border);
        border-radius: var(--radius-card);
        background: var(--surface);
        text-align: center;
        color: var(--muted);
      }

      .viewer {
        width: min(420px, calc(100vw - 32px));
        max-height: calc(100dvh - 32px);
        padding: 16px;
        border: 0;
        border-radius: var(--radius-card);
        background: var(--surface);
        box-shadow: var(--shadow-float);
      }

      .viewer::backdrop {
        background: rgb(16 26 51 / 60%);
      }

      .viewer img {
        display: block;
        width: 100%;
        max-height: calc(100dvh - 140px);
        object-fit: contain;
        margin-bottom: 16px;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .button {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid var(--navy);
        border-radius: var(--radius-control);
        background: var(--surface);
        font: inherit;
        font-weight: 600;
        color: var(--navy);
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }

      .button.primary {
        background: var(--navy);
        color: var(--surface);
      }

      .button.primary:hover {
        background: var(--navy-hover);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="header">
        <img src="rato-icon.svg" alt="" />
        <div>
          <h1 class="title">Photo gallery</h1>
          <p class="caption">Strips guests shared from the photo booth. Tap one to see it full size and save it.</p>
        </div>
      </header>
      <p class="message" id="status">Loading the photos…</p>
      <div class="grid" id="grid"></div>
    </main>

    <dialog class="viewer" id="viewer" aria-label="Photo strip">
      <img id="viewer-image" alt="Your photo strip" />
      <div class="actions">
        <a class="button primary" id="viewer-save" download>Save photo</a>
        <button class="button" type="button" id="viewer-close">Close</button>
      </div>
    </dialog>

    <script>
      // Reads the list the booth laptop uploads (gallery.json) from Firebase Storage. The booth
      // only uploads strips a guest chose to share online.
      const BUCKET = 'rato-d2428.firebasestorage.app'
      const STORAGE = `https://firebasestorage.googleapis.com/v0/b/${BUCKET}/o/`
      const REFRESH_MS = 10_000
      // The booth's share code format (server/services/strips.ts), so a bad entry never becomes a URL.
      const SHARE_CODE = /^[a-z2-9]{10}$/

      const status = document.getElementById('status')
      const grid = document.getElementById('grid')
      const viewer = document.getElementById('viewer')
      const viewerImage = document.getElementById('viewer-image')
      const viewerSave = document.getElementById('viewer-save')
      let shown = ''

      function fileUrl(path) {
        return `${STORAGE}${encodeURIComponent(path)}?alt=media`
      }

      // The booth stores times in UTC as "YYYY-MM-DD HH:MM:SS".
      function formatTime(createdAt) {
        const date = new Date(`${createdAt.replace(' ', 'T')}Z`)
        if (Number.isNaN(date.getTime())) return 'the photo booth'
        return date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })
      }

      function showMessage(text) {
        status.textContent = text
        status.hidden = false
      }

      function openStrip(url) {
        viewerImage.src = url
        viewerSave.href = url
        viewer.showModal()
      }

      function render(strips) {
        grid.replaceChildren(
          ...strips.map(({ code, createdAt }) => {
            const url = fileUrl(`strips/${code}.png`)
            const time = formatTime(createdAt)
            const button = document.createElement('button')
            button.type = 'button'
            button.className = 'strip'
            button.setAttribute('aria-label', `Open the strip from ${time}`)
            const image = document.createElement('img')
            image.src = url
            image.alt = 'A shared photo strip'
            image.loading = 'lazy'
            const caption = document.createElement('span')
            caption.className = 'caption'
            caption.textContent = time
            button.append(image, caption)
            button.addEventListener('click', () => openStrip(url))
            return button
          }),
        )
        if (strips.length === 0) showMessage('No photos have been shared yet.')
        else status.hidden = true
      }

      async function load() {
        try {
          const response = await fetch(fileUrl('gallery.json'), { cache: 'no-store' })
          if (!response.ok) throw new Error(`HTTP ${response.status}`)
          const index = await response.json()
          const strips = (Array.isArray(index.strips) ? index.strips : []).filter(
            (strip) => typeof strip.code === 'string' && SHARE_CODE.test(strip.code) && typeof strip.createdAt === 'string',
          )
          // Re-render only on change, so a refresh never resets the page under the guest.
          const key = JSON.stringify(strips)
          if (key !== shown) {
            shown = key
            render(strips)
          }
        } catch {
          if (shown === '') showMessage('The photos could not be loaded. Check your connection and try again.')
        }
      }

      document.getElementById('viewer-close').addEventListener('click', () => viewer.close())
      viewer.addEventListener('click', (event) => {
        if (event.target === viewer) viewer.close()
      })
      load()
      setInterval(load, REFRESH_MS)
    </script>
  </body>
</html>
